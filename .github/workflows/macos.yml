name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build everything (library, command line tool, app)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Build the app bundle
        run: Scripts/make-app.sh

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Disk-Inventory-X
          path: build/Disk Inventory X.app
          if-no-files-found: error
