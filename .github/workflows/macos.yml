name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build everything (library, command line tool, app)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Benchmark scanning
        # prints scan / layout / render times; each folder twice (the second run has a warm file cache)
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu
          for dir in /Applications /usr /System/Library; do
            for run in 1 2; do
              echo "=== $dir (run $run)"
              DIX_SCAN_STATS=1 .build/release/treemap-demo "$dir" 1600 1000 "$RUNNER_TEMP/bench.png" 2>&1 | head -3
            done
          done

      - name: Build the app bundle
        run: Scripts/make-app.sh

      - name: Build the disk image
        run: Scripts/make-dmg.sh

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: Disk-Inventory-X-dmg
          path: build/Disk-Inventory-X.dmg
          if-no-files-found: error
