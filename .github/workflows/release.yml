name: Release

# Publishes the disk image as a GitHub Release when a tag like v2.0 is pushed:
#   git tag v2.0 && git push origin v2.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build the app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}" Scripts/make-app.sh

      - name: Build the disk image
        run: |
          Scripts/make-dmg.sh
          mv build/Disk-Inventory-X.dmg "build/Disk-Inventory-X-${GITHUB_REF_NAME#v}.dmg"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/Disk-Inventory-X-${GITHUB_REF_NAME#v}.dmg" \
            --title "Disk Inventory X ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Requires macOS 14 or later on an Apple Silicon Mac. The app is not signed or notarized: on first launch right-click it and choose Open."
